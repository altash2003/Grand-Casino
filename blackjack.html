<!DOCTYPE html>
<html>
<head>
    <title>Blackjack</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;800&display=swap" rel="stylesheet">
    <style>
        body { background: #0f3d26; color: white; font-family: 'Rajdhani'; margin: 0; text-align: center; }
        .nav { background: #222; padding: 10px; display: flex; justify-content: center; gap: 10px; }
        .nav a { color: #888; text-decoration: none; font-weight: bold; padding: 5px 15px; background: #111; border-radius: 4px; }
        .nav a.active { background: gold; color: black; }
        .table { min-height: 80vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
        .cards { display: flex; gap: 10px; justify-content: center; min-height: 120px; }
        .card { width: 70px; height: 100px; background: white; color: black; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; }
        .controls { display: none; gap: 10px; }
        .controls.active { display: flex; }
        button { padding: 10px 20px; font-size: 18px; cursor: pointer; border-radius: 6px; border: none; font-weight: bold; }
    </style>
</head>
<body>
    <div id="auth" style="position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:9; display:flex; justify-content:center; align-items:center; flex-direction:column; gap:10px;">
        <h1 style="color:gold">LOGIN</h1>
        <input id="u" placeholder="User"><input id="p" type="password" placeholder="Pass">
        <button onclick="login()">Enter</button>
    </div>

    <div class="nav">
        <a href="/">COLORS</a>
        <a href="/roulette">ROULETTE</a>
        <a href="/blackjack" class="active">BLACKJACK</a>
        <a href="/baccarat">BACCARAT</a>
    </div>

    <div class="table">
        <h3>DEALER</h3>
        <div class="cards" id="dHand"></div>
        <div id="status" style="font-size:30px; color:gold;">PLACE BET</div>
        <div class="cards" id="pHand"></div>
        <h3>YOU | Bal: <span id="bal">0</span></h3>
        <div id="betPanel">
            <button style="background:gold" onclick="deal(50)">DEAL 50</button>
            <button style="background:gold" onclick="deal(100)">DEAL 100</button>
        </div>
        <div id="actPanel" class="controls">
            <button style="background:#00E5FF" onclick="s.emit('bj_hit', curState)">HIT</button>
            <button style="background:#ff4444" onclick="s.emit('bj_stand', curState)">STAND</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const s = io();
        let curState = null;
        function login(){s.emit('login',{u:document.getElementById('u').value,p:document.getElementById('p').value});}
        s.on('login_ok',d=>{document.getElementById('auth').style.display='none';document.getElementById('bal').innerText=d.b;});
        s.on('update_balance',b=>document.getElementById('bal').innerText=b);
        function deal(amt){ s.emit('bj_deal', amt); }
        s.on('bj_state', st => {
            curState = st;
            document.getElementById('betPanel').style.display='none';
            document.getElementById('actPanel').classList.add('active');
            document.getElementById('status').innerText = "YOUR TURN";
            render(st.pHand, 'pHand');
            render([st.dUp, {s:'',v:'?'}], 'dHand');
        });
        s.on('bj_update', d => { curState.pHand = d.pHand; render(d.pHand, 'pHand'); });
        s.on('bj_bust', () => { document.getElementById('status').innerText = "BUST!"; endGame(); });
        s.on('bj_end', d => {
            render(d.dHand, 'dHand');
            document.getElementById('status').innerText = d.result + (d.win>0 ? ` +${d.win}` : '');
            endGame();
        });
        function endGame() {
            document.getElementById('actPanel').classList.remove('active');
            setTimeout(()=> { document.getElementById('betPanel').style.display='block'; document.getElementById('status').innerText="PLACE BET"; }, 3000);
        }
        function render(cards, el) {
            const div = document.getElementById(el); div.innerHTML='';
            cards.forEach(c => {
                let color = (c.s==='H'||c.s==='D')?'red':'black';
                let suit = {'H':'♥','D':'♦','S':'♠','C':'♣'}[c.s] || '';
                div.innerHTML += `<div class="card" style="color:${color}">${c.v}${suit}</div>`;
            });
        }
    </script>
</body>
</html>
