<!DOCTYPE html>
<html>
<head>
    <title>Grand Casino</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- GLOBAL SETUP --- */
        body { background: url('background.jpg') no-repeat center center fixed; background-size: cover; color: white; font-family: 'Rajdhani', sans-serif; margin: 0; text-align: center; overflow: hidden; user-select: none; }
        ::-webkit-scrollbar { width: 5px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        .view { display: none; height: 100vh; width: 100%; flex-direction: column; align-items: center; justify-content: center; }
        .view.active { display: flex; }

        /* --- UI COMPONENTS --- */
        .glass-panel { background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px); padding: 40px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 0 50px rgba(0,0,0,0.8); }
        .btn-main { padding: 15px 30px; font-size: 20px; border-radius: 8px; background: gold; color: black; margin: 10px; width: 220px; cursor: pointer; border: 2px solid #b8860b; font-weight: bold; transition: 0.2s; }
        .btn-main:hover { transform: scale(1.05); filter: brightness(1.2); }
        input { padding: 12px; border-radius: 4px; border: 1px solid #555; background: rgba(0,0,0,0.5); color: white; text-align: center; font-size: 16px; margin: 5px; }

        /* --- CHIPS --- */
        .chip-rack { display: flex; gap: 10px; background: rgba(0,0,0,0.5); padding: 5px 20px; border-radius: 30px; margin-top: 15px; justify-content: center; }
        .chip { width: 50px; height: 50px; border-radius: 50%; border: 3px dashed #fff; box-shadow: 0 4px 5px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; font-weight: 800; cursor: pointer; color: white; text-shadow: 0 1px 2px black; font-size: 12px; transition: 0.2s; position: relative; }
        .chip.active { transform: scale(1.2) translateY(-5px); border-color: gold; box-shadow: 0 10px 15px rgba(0,0,0,0.8); z-index: 10; }
        
        .chip-50 { background: #d32f2f; border-color: #ffcccc; } /* RED */
        .chip-100 { background: #1976d2; border-color: #ccccff; } /* BLUE */
        .chip-500 { background: #388e3c; border-color: #ccffcc; } /* GREEN */
        .chip-1k { background: #111; border-color: #666; } /* BLACK */
        .chip-10k { background: #fbc02d; color: black; text-shadow: none; border-color: #ffffcc; } /* YELLOW */
        .chip-100k { background: #f5f5f5; color: black; text-shadow: none; border-color: #fff; } /* WHITE */

        /* --- ROULETTE TABLE RECONSTRUCTION --- */
        .roulette-wrapper { display: flex; flex-direction: row; align-items: center; justify-content: center; width: 100%; height: 100%; gap: 40px; }
        .wheel-section { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; min-width: 300px; }
        .wheel-container { position: relative; width: 380px; height: 380px; border-radius: 50%; border: 12px solid #1a1a1a; box-shadow: 0 0 60px black; background: #000; }
        .wheel-img { width: 100%; height: 100%; border-radius: 50%; transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1); }
        .wheel-marker { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); color: gold; font-size: 45px; z-index: 10; text-shadow: 0 3px 5px black; }
        
        .table-section { flex: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        
        /* THE FELT GRID */
        .r-table-container { position: relative; background: #0f3d26; padding: 30px; border-radius: 12px; border: 10px solid #3e2723; box-shadow: 0 30px 80px black; }
        
        /* Grid Layout: 14 cols x 5 rows. 
           Cols: [0/00] [1] [Split] [2] [Split] [3] ... 
           Actually simpler to use pure CSS grid with gaps and overlays for splits. 
        */
        .r-grid { 
            display: grid; 
            grid-template-columns: 50px repeat(12, 55px) 40px; 
            grid-template-rows: 55px 55px 55px 50px 50px; 
            gap: 2px; 
        }

        .rc { 
            display: flex; align-items: center; justify-content: center; 
            font-weight: bold; cursor: pointer; font-size: 18px; 
            border: 1px solid rgba(255,255,255,0.15); color: white; position: relative;
        }
        .rc:hover { background-color: rgba(255, 215, 0, 0.3); }
        
        .rc-red { background-color: #d32f2f; } 
        .rc-black { background-color: #222; } 
        .rc-green { background-color: #2e7d32; }
        .rc-felt { background: transparent; font-size: 14px; color: #ddd; border-color: rgba(255,255,255,0.3); }

        /* HITBOXES FOR SPLITS & CORNERS */
        /* These are absolute positioned divs over the grid lines */
        .hitbox { position: absolute; z-index: 20; cursor: pointer; /* background: rgba(0,255,0,0.2); */ /* Uncomment to debug */ }
        .hitbox:hover { background: rgba(255, 215, 0, 0.4); box-shadow: 0 0 5px gold; }

        /* VISUAL CHIP ON TABLE */
        .table-chip {
            position: absolute; width: 24px; height: 24px; border-radius: 50%; 
            font-size: 9px; display: flex; align-items: center; justify-content: center; 
            font-weight: bold; border: 2px solid white; box-shadow: 0 2px 4px black; 
            pointer-events: none; z-index: 50; transform: translate(-50%, -50%);
        }

        /* --- COLOR GAME (3-COLUMN) --- */
        .cg-container { display: grid; grid-template-columns: 260px 1fr 260px; gap: 20px; width: 95%; height: 90vh; max-width: 1600px; }
        .side-panel { background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
        .panel-header { padding: 15px; font-weight: 800; color: gold; background: rgba(0,0,0,0.4); text-align: center; }
        .panel-body { flex-grow: 1; overflow-y: auto; padding: 10px; text-align: left; }
        .pl-item { padding: 5px 10px; font-size: 13px; color: #ccc; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .game-wrapper { background: rgba(15,20,25,0.8); border: 1px solid rgba(255,255,255,0.15); border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .bet-card { height: 100px; border-radius: 8px; cursor: pointer; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: 0.1s; font-weight: bold; }
        .bet-card:hover { transform: translateY(-2px); filter: brightness(1.2); }
        .die { width: 90px; height: 90px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; border: 3px solid rgba(255,255,255,0.2); background: #222; }

        /* TOAST */
        #toastBox { position: fixed; top: 50px; left: 50%; transform: translateX(-50%); z-index: 20000; pointer-events: none; }
        .toast { background: rgba(0,0,0,0.9); border: 2px solid gold; padding: 15px; border-radius: 8px; color: gold; font-weight: bold; margin-bottom: 5px; animation: slideDown 0.3s forwards; }
        @keyframes slideDown { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* CHAT */
        .chat-view-panel { display: none; flex-grow: 1; flex-direction: column; overflow: hidden; }
        .chat-view-panel.active { display: flex; }
        .chat-msg { background: rgba(0,0,0,0.3); padding: 8px 10px; border-radius: 6px; margin-bottom: 6px; font-size: 12px; text-align: left; }
        
        /* BLACKJACK CARDS */
        .card { width: 70px; height: 100px; background: white; color: black; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; font-size: 24px; margin: 4px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }

        @media (max-width: 768px) {
            .roulette-wrapper { flex-direction: column; gap: 10px; }
            .wheel-container { width: 250px; height: 250px; }
            .r-grid { grid-template-columns: 35px repeat(12, 30px) 30px; grid-template-rows: repeat(5, 35px); }
            .rc { font-size: 10px; }
            .cg-container { display: flex; flex-direction: column; width: 100%; height: 100vh; }
            .side-panel { display: none; }
        }
    </style>
</head>
<body>

    <div id="toastBox"></div>
    <audio id="bgMusic"></audio>

    <div id="v-auth" class="view active">
        <h1 style="color:gold; font-size: 60px;">GRAND CASINO</h1>
        <div class="glass-panel">
            <h3 id="auth-title">MEMBER LOGIN</h3>
            <input id="u-in" placeholder="Username"><br>
            <input id="p-in" type="password" placeholder="Password"><br><br>
            <button id="btn-auth-action" class="btn-main" onclick="submitAuth()">ENTER CASINO</button><br>
            <button id="btn-auth-toggle" style="background:transparent; border:none; color:#aaa; margin-top:15px; text-decoration: underline; cursor:pointer;" onclick="toggleAuthMode()">Register New Account</button>
        </div>
    </div>

    <div id="v-home" class="view">
        <div class="glass-panel" style="width: 80%; max-width: 800px;">
            <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
                <h2>WELCOME, <span id="home-user" style="color:gold;">PLAYER</span></h2>
                <h2>BAL: <span id="home-bal" style="color:gold;">0</span></h2>
            </div>
            <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 20px;">
                <button class="btn-main" onclick="nav('v-color')" style="background: linear-gradient(45deg, #FFD700, #FFA000);">COLOR GAME</button>
                <button class="btn-main" onclick="nav('v-roulette')" style="background: linear-gradient(45deg, #00E5FF, #0097A7); color:white;">ROULETTE</button>
                <button class="btn-main" onclick="nav('v-blackjack')" style="background: linear-gradient(45deg, #00C853, #007E33); color:white;">BLACKJACK</button>
                <button class="btn-main" onclick="nav('v-baccarat')" style="background: linear-gradient(45deg, #FF4444, #CC0000); color:white;">BACCARAT</button>
            </div>
            <button onclick="openAdmin()" style="margin-top:20px; background:rgba(255,255,255,0.1); border:none; color:#888; padding:5px 10px; cursor:pointer;">ADMIN PANEL</button>
        </div>
    </div>

    <div id="v-roulette" class="view" style="background: radial-gradient(circle, #1a1a1a, #000);">
        <button onclick="nav('v-home')" style="position:absolute; top:20px; left:20px; padding:10px; background:#333; color:white; border:1px solid #555; cursor:pointer; z-index:100;">LOBBY</button>
        
        <div class="roulette-wrapper">
            <div class="wheel-section">
                <div class="wheel-container">
                    <img src="wheel.png" class="wheel-img" id="wheelImg">
                    <div class="wheel-marker">▼</div>
                </div>
                <h1 id="res-roul" style="font-size:40px; color:gold; margin:20px; text-shadow:0 0 10px gold;">BETS OPEN</h1>
                <div id="timer-roul" style="font-size:30px; color:cyan;">20</div>
            </div>

            <div class="table-section">
                <div style="margin-bottom:10px; color:gold; font-size:20px; font-weight:800;">BALANCE: <span id="bal-roul">0</span></div>
                
                <div class="r-table-container" id="rTableContainer">
                    <div class="r-grid" id="rGrid">
                        <div style="grid-row:1/span 3; grid-column:1; display:flex; flex-direction:column;">
                            <div class="rc rc-green" style="flex:1; border-bottom:1px solid rgba(255,255,255,0.2);" onclick="placeRBet(this, ['0'], 35)">0</div>
                            <div class="rc rc-green" style="flex:1;" onclick="placeRBet(this, ['00'], 35)">00</div>
                        </div>
                        <div class="rc rc-felt" style="grid-row:1; grid-column:14;" onclick="placeRBet(this, '2TO1_3', 2)">2:1</div>
                        <div class="rc rc-felt" style="grid-row:2; grid-column:14;" onclick="placeRBet(this, '2TO1_2', 2)">2:1</div>
                        <div class="rc rc-felt" style="grid-row:3; grid-column:14;" onclick="placeRBet(this, '2TO1_1', 2)">2:1</div>

                        <div class="rc rc-felt" style="grid-row:4; grid-column:2/span 4;" onclick="placeRBet(this, '1ST12', 2)">1st 12</div>
                        <div class="rc rc-felt" style="grid-row:4; grid-column:6/span 4;" onclick="placeRBet(this, '2ND12', 2)">2nd 12</div>
                        <div class="rc rc-felt" style="grid-row:4; grid-column:10/span 4;" onclick="placeRBet(this, '3RD12', 2)">3rd 12</div>

                        <div class="rc rc-felt" style="grid-row:5; grid-column:2/span 2;" onclick="placeRBet(this, '1-18', 1)">1-18</div>
                        <div class="rc rc-felt" style="grid-row:5; grid-column:4/span 2;" onclick="placeRBet(this, 'EVEN', 1)">EVEN</div>
                        <div class="rc rc-red" style="grid-row:5; grid-column:6/span 2;" onclick="placeRBet(this, 'RED', 1)"></div>
                        <div class="rc rc-black" style="grid-row:5; grid-column:8/span 2;" onclick="placeRBet(this, 'BLACK', 1)"></div>
                        <div class="rc rc-felt" style="grid-row:5; grid-column:10/span 2;" onclick="placeRBet(this, 'ODD', 1)">ODD</div>
                        <div class="rc rc-felt" style="grid-row:5; grid-column:12/span 2;" onclick="placeRBet(this, '19-36', 1)">19-36</div>
                    </div>
                    <div id="hitboxLayer" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;"></div>
                </div>

                <div class="chip-rack">
                    <div class="chip chip-50 active" onclick="setChip(50, this)">50</div>
                    <div class="chip chip-100" onclick="setChip(100, this)">100</div>
                    <div class="chip chip-500" onclick="setChip(500, this)">500</div>
                    <div class="chip chip-1k" onclick="setChip(1000, this)">1K</div>
                    <div class="chip chip-10k" onclick="setChip(10000, this)">10K</div>
                    <div class="chip chip-100k" onclick="setChip(100000, this)">100K</div>
                </div>
            </div>
        </div>
    </div>

    <div id="v-color" class="view">
        <div class="cg-container">
            <div class="side-panel">
                <div class="panel-header">PLAYERS</div>
                <div class="panel-body" id="activeListBody"></div>
            </div>
            <div class="game-wrapper">
                <button class="btn-back-lobby" onclick="nav('v-home')">LOBBY</button>
                <div style="margin-top:20px; font-size:24px; color:gold;">BAL: <span id="bal-color">0</span></div>
                <div style="flex-grow:1; display:flex; flex-direction:column; align-items:center; justify-content:center;">
                    <div id="status" style="font-size:24px; color:#aaa; margin-bottom:10px;">BETS OPEN</div>
                    <div id="timer" style="font-size:80px; color:cyan;">20</div>
                    <div style="display:flex; gap:20px;">
                        <div id="d1" class="die" style="background:#222; border:2px solid white;">?</div>
                        <div id="d2" class="die" style="background:#222; border:2px solid white;">?</div>
                        <div id="d3" class="die" style="background:#222; border:2px solid white;">?</div>
                    </div>
                </div>
                <div style="padding:20px; background:rgba(0,0,0,0.3);">
                    <div style="display:grid; grid-template-columns:repeat(6,1fr); gap:10px;">
                        <div class="bet-card" style="background:#d32f2f;" onclick="betC('RED')">RED</div>
                        <div class="bet-card" style="background:#388e3c;" onclick="betC('GREEN')">GREEN</div>
                        <div class="bet-card" style="background:#1976d2;" onclick="betC('BLUE')">BLUE</div>
                        <div class="bet-card" style="background:#f06292;" onclick="betC('PINK')">PINK</div>
                        <div class="bet-card" style="background:#f5f5f5; color:black;" onclick="betC('WHITE')">WHITE</div>
                        <div class="bet-card" style="background:#fbc02d; color:black;" onclick="betC('YELLOW')">YELLOW</div>
                    </div>
                </div>
            </div>
            <div class="side-panel">
                <div style="padding:10px; color:gold; text-align:center;">CHAT</div>
                <div id="chatList" style="flex:1; padding:10px; overflow-y:auto;"></div>
                <div style="display:flex; padding:10px;"><input id="chatInput" style="flex:1;"><button onclick="sendChat()">></button></div>
            </div>
        </div>
    </div>

    <div id="v-blackjack" class="view" style="background: radial-gradient(circle, #1a4d2e, #000);">
        <button class="btn-back-lobby" onclick="nav('v-home')">LOBBY</button>
        <div style="font-size:24px; color:gold; margin-top:20px;">BAL: <span id="bal-bj">0</span></div>
        <div style="margin-top:50px; color:#88cfa3;">DEALER</div>
        <div id="dh" style="min-height:110px; display:flex; gap:10px; justify-content:center;"></div>
        <div id="bj-stat" style="font-size:30px; color:gold; margin:20px;">PLACE BET</div>
        <div id="ph" style="min-height:110px; display:flex; gap:10px; justify-content:center;"></div>
        <div style="color:#88cfa3;">YOU</div>
        <div style="margin-top:20px;">
            <div id="bj-bet-ui"><button class="btn-main" onclick="bjDeal(50)">DEAL 50</button></div>
            <div id="bj-play-ui" style="display:none;"><button class="btn-main" onclick="s.emit('bj_hit', bjState)">HIT</button><button class="btn-main" onclick="s.emit('bj_stand', bjState)">STAND</button></div>
        </div>
    </div>

    <div id="v-baccarat" class="view" style="background: radial-gradient(circle, #5a0000, #000);">
        <button class="btn-back-lobby" onclick="nav('v-home')">LOBBY</button>
        <div style="font-size:24px; color:gold; margin-top:20px;">BAL: <span id="bal-bacc">0</span></div>
        <div style="font-size:30px; color:cyan; margin-top:50px;">TIMER: <span id="t-bacc">0</span></div>
        <div id="bacc-res" style="font-size:40px; margin:20px;">--</div>
        <div style="display:flex; gap:20px;">
            <button class="btn-main" onclick="betB('PLAYER')" style="border-color:#00E5FF; background:transparent; color:#00E5FF;">PLAYER<br>1:1</button>
            <button class="btn-main" onclick="betB('TIE')" style="border-color:#00C853; background:transparent; color:#00C853;">TIE<br>8:1</button>
            <button class="btn-main" onclick="betB('BANKER')" style="border-color:#FF4444; background:transparent; color:#FF4444;">BANKER<br>0.95:1</button>
        </div>
    </div>

    <div id="v-admin" class="view" style="background:#111;">
        <button class="btn-back-lobby" onclick="nav('v-home')">EXIT</button>
        <h2 style="color:gold;">ADMIN</h2>
        <div id="ad-list" style="color:white; margin-top:20px;"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const s = io();
        let curChip = 50;
        let isRegister = false;
        let bjState = null;

        function nav(id) { document.querySelectorAll('.view').forEach(v=>v.classList.remove('active')); document.getElementById(id).classList.add('active'); }
        function toggleAuthMode() { isRegister=!isRegister; document.getElementById('auth-title').innerText=isRegister?"CREATE":"LOGIN"; document.getElementById('btn-auth-action').innerText=isRegister?"REGISTER":"ENTER"; }
        function submitAuth() { const u=document.getElementById('u-in').value, p=document.getElementById('p-in').value; if(u&&p) s.emit(isRegister?'register':'login', {username:u, password:p, u:u, p:p}); }
        s.on('login_success', d=>{ nav('v-home'); updateBal(d.balance); document.getElementById('home-user').innerText=d.username; });
        s.on('login_error', m=>alert(m));
        
        function updateBal(b) { ['home','color','roul','bj','bacc'].forEach(i=>document.getElementById('bal-'+i).innerText=b); }
        s.on('update_balance', updateBal);
        
        function toast(m) { const b=document.getElementById('toastBox'), d=document.createElement('div'); d.className='toast'; d.innerText=m; b.appendChild(d); setTimeout(()=>d.remove(),3000); }
        s.on('notification', d=>toast(d.msg));

        // CHIPS
        function setChip(v, el) { curChip=v; document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active')); el.classList.add('active'); }

        // ROULETTE LOGIC
        const rGrid = document.getElementById('rGrid');
        const hitboxLayer = document.getElementById('hitboxLayer');
        const R_REDS = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
        
        // 1. GENERATE NUMBERS
        for(let col=1; col<=12; col++) {
            // Row 3 (Top visually): 3*col
            // Row 2 (Mid visually): 3*col-1
            // Row 1 (Bot visually): 3*col-2
            let topNum = 3*col, midNum = 3*col-1, botNum = 3*col-2;
            createCell(topNum, 1, col+1);
            createCell(midNum, 2, col+1);
            createCell(botNum, 3, col+1);
            
            // 2. GENERATE HITBOXES (SPLITS & CORNERS)
            setTimeout(() => { // Wait for render
                // Vertical Splits (between numbers in column)
                createHitbox(topNum, 1, col+1, 'v-split', [topNum, midNum], 17); // Split 3-2
                createHitbox(midNum, 2, col+1, 'v-split', [midNum, botNum], 17); // Split 2-1
                
                // Horizontal Splits (between columns)
                if (col < 12) {
                    createHitbox(topNum, 1, col+1, 'h-split', [topNum, topNum+3], 17); // Split 3-6
                    createHitbox(midNum, 2, col+1, 'h-split', [midNum, midNum+3], 17); // Split 2-5
                    createHitbox(botNum, 3, col+1, 'h-split', [botNum, botNum+3], 17); // Split 1-4
                    
                    // Corners
                    createHitbox(topNum, 1, col+1, 'corner', [topNum, midNum, topNum+3, midNum+3], 8); // Corner
                    createHitbox(midNum, 2, col+1, 'corner', [midNum, botNum, midNum+3, botNum+3], 8); // Corner
                }
                
                // Street (Top Edge) - Row of 3
                createHitbox(topNum, 0, col+1, 'street', [botNum, midNum, topNum], 11);
                
                // Six Line (Intersection on top edge)
                if (col < 12) createHitbox(topNum, 0, col+1, 'sixline', [botNum, midNum, topNum, botNum+3, midNum+3, topNum+3], 5);
            }, 100);
        }

        function createCell(num, row, colIdx) {
            let div = document.createElement('div');
            div.className = `rc ${R_REDS.includes(num)?'rc-red':'rc-black'}`;
            div.innerText = num; div.style.gridRow = row; div.style.gridColumn = colIdx;
            div.onclick = (e) => placeRBet(e.target, [num.toString()], 35);
            rGrid.appendChild(div);
        }

        function createHitbox(refNum, row, col, type, nums, payout) {
            let hb = document.createElement('div');
            hb.className = 'hitbox';
            hb.style.pointerEvents = 'auto'; // Enable clicking
            
            // Positioning Logic based on grid units (approximate for layout)
            // Cell width ~55px, height ~55px
            let top = (row-1) * 57 + 30; // Offset
            let left = (col-1) * 57 + 50; 

            if(type === 'v-split') {
                hb.style.width = "55px"; hb.style.height = "10px";
                hb.style.top = (top + 50) + "px"; hb.style.left = left + "px";
            } else if (type === 'h-split') {
                hb.style.width = "10px"; hb.style.height = "55px";
                hb.style.top = top + "px"; hb.style.left = (left + 50) + "px";
            } else if (type === 'corner') {
                hb.style.width = "20px"; hb.style.height = "20px";
                hb.style.top = (top + 45) + "px"; hb.style.left = (left + 45) + "px";
            } else if (type === 'street') {
                hb.style.width = "55px"; hb.style.height = "10px";
                hb.style.top = (top - 5) + "px"; hb.style.left = left + "px"; // Top edge
            } else if (type === 'sixline') {
                hb.style.width = "20px"; hb.style.height = "20px";
                hb.style.top = (top - 10) + "px"; hb.style.left = (left + 45) + "px";
            }

            hb.onclick = (e) => placeRBet(e.target, nums.map(String), payout);
            hitboxLayer.appendChild(hb);
        }

        function placeRBet(target, nums, payout) {
            s.emit('bet_roulette', { numbers: nums, payout: payout, amount: curChip });
            
            // Visual Chip
            let rect = target.getBoundingClientRect();
            let parent = document.getElementById('rTableContainer').getBoundingClientRect();
            
            let chip = document.createElement('div');
            chip.className = getChipClass(curChip) + " table-chip";
            chip.innerText = formatChip(curChip);
            // Calc relative pos
            chip.style.left = (rect.left - parent.left + rect.width/2) + "px";
            chip.style.top = (rect.top - parent.top + rect.height/2) + "px";
            
            document.getElementById('hitboxLayer').appendChild(chip);
            // Clear chips on reset
            setTimeout(() => { if(document.getElementById('res-roul').innerText === "BETS OPEN") chip.remove(); }, 20000); 
        }

        function getChipClass(v) {
            if(v===50) return 'chip-50'; if(v===100) return 'chip-100'; if(v===500) return 'chip-500';
            if(v===1000) return 'chip-1k'; if(v===10000) return 'chip-10k'; return 'chip-100k';
        }
        function formatChip(v) { return v >= 1000 ? (v/1000)+'k' : v; }

        // --- COMMON GAME LOGIC ---
        function betC(c) { s.emit('place_bet', {color:c, amount:curChip}); }
        function betB(t) { s.emit('bet_baccarat', {bet:t, amount:curChip}); }
        function bjDeal(a) { s.emit('bj_deal', a); }
        function sendChat() { s.emit('chat_msg', document.getElementById('chatInput').value); document.getElementById('chatInput').value=''; }
        function openAdmin() { if(prompt("Pass")==="Kenm4") { nav('v-admin'); s.emit('admin_req_data'); } }

        s.on('game_rolling', () => { 
            document.getElementById('wheelImg').style.transform = `rotate(${360*5 + Math.random()*360}deg)`; 
            document.getElementById('res-roul').innerText = "SPINNING";
            // Clear chips logic if needed
            document.querySelectorAll('.table-chip').forEach(c => c.remove());
        });
        s.on('result_roulette', d => {
            document.getElementById('res-roul').innerText = d.result.n + " " + d.result.c;
            document.getElementById('wheelImg').style.transition = 'none';
            document.getElementById('wheelImg').style.transform = 'rotate(0deg)';
            setTimeout(()=>document.getElementById('wheelImg').style.transition='transform 4s cubic-bezier(0.1, 0.8, 0.1, 1)', 50);
        });
        s.on('timer_update', t => {
            ['timer','timer-roul','t-bacc'].forEach(i=>document.getElementById(i).innerText=t);
            if(t===20) document.getElementById('res-roul').innerText="BETS OPEN";
        });
        
        // Dice visual
        s.on('game_result', r => { ['d1','d2','d3'].forEach((d,i)=>document.getElementById(d).className=`die ${r[i]}`); });
        // Baccarat visual
        s.on('result_baccarat', r => document.getElementById('bacc-res').innerText = `${r.winner} (P:${r.pScore} B:${r.bScore})`);
        
        // Blackjack visual
        s.on('bj_state', st => { 
            bjState=st; document.getElementById('bj-bet-ui').style.display='none'; document.getElementById('bj-play-ui').style.display='block';
            renderCards(st.pHand, 'ph'); renderCards([st.dUp, {s:'',v:'?'}], 'dh');
        });
        s.on('bj_update', d => { bjState.pHand=d.pHand; renderCards(d.pHand, 'ph'); });
        s.on('bj_end', d => {
            renderCards(d.dHand, 'dh'); document.getElementById('bj-play-ui').style.display='none'; document.getElementById('bj-bet-ui').style.display='block';
            alert(`BJ Result: ${d.result}`);
        });
        function renderCards(h, el) { 
            const d=document.getElementById(el); d.innerHTML=''; 
            h.forEach(c => d.innerHTML += `<div class="card" style="color:${['H','D'].includes(c.s)?'red':'black'}">${c.v}</div>`); 
        }
    </script>
</body>
</html>
