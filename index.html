<!DOCTYPE html>
<html>
<head>
    <title>Grand Casino</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- GLOBAL SETUP --- */
        body { 
            background: url('background.jpg') no-repeat center center fixed; 
            background-size: cover; 
            color: white; 
            font-family: 'Rajdhani', sans-serif; 
            margin: 0; 
            text-align: center; 
            overflow: hidden; 
            user-select: none;
        }
        
        /* VIEWS SYSTEM */
        .view { display: none; height: 100vh; width: 100%; flex-direction: column; align-items: center; justify-content: center; }
        .view.active { display: flex; }

        /* --- UI COMPONENTS --- */
        .glass-panel {
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px);
            padding: 40px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }
        .btn-main { 
            padding: 15px 30px; font-size: 20px; border-radius: 8px; 
            background: gold; color: black; margin: 10px; width: 220px; 
            cursor: pointer; border: 2px solid #b8860b; font-weight: bold; transition: 0.2s; 
        }
        .btn-main:hover { transform: scale(1.05); filter: brightness(1.2); }
        input { padding: 12px; border-radius: 4px; border: 1px solid #555; background: rgba(0,0,0,0.5); color: white; text-align: center; font-size: 16px; margin: 5px; }

        /* --- ROULETTE STYLES (PlayPager Inspired) --- */
        .roulette-wrapper {
            display: flex; flex-direction: row; align-items: center; justify-content: center;
            width: 100%; height: 100%; gap: 20px;
        }
        .wheel-section {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            flex: 1; min-width: 300px;
        }
        .wheel-container {
            position: relative; width: 350px; height: 350px; border-radius: 50%;
            border: 8px solid #222; box-shadow: 0 0 50px black; background: #000;
        }
        .wheel-img { width: 100%; height: 100%; border-radius: 50%; transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1); }
        .wheel-marker { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); color: gold; font-size: 40px; z-index: 10; text-shadow: 0 2px 5px black; }
        
        .table-section {
            flex: 2; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        
        /* CSS GRID BETTING TABLE (Recreated from your photo) */
        .r-table {
            display: grid;
            grid-template-columns: 50px repeat(12, 50px) 40px; 
            grid-template-rows: repeat(3, 50px) 50px 50px;
            gap: 2px;
            background: #0f3d26; padding: 10px; border-radius: 8px; border: 5px solid #3e2723;
            box-shadow: 0 20px 50px black;
        }
        .rc { 
            display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; 
            font-size: 16px; border: 1px solid rgba(255,255,255,0.1); color: white; transition: 0.1s;
        }
        .rc:hover { filter: brightness(1.3); border-color: gold; }
        .rc:active { transform: scale(0.95); }
        
        .rc-red { background: #d32f2f; } .rc-black { background: #222; } .rc-green { background: #2e7d32; }
        .rc-felt { background: transparent; font-size: 12px; color: #ddd; }
        
        /* CHIPS */
        .chip-rack { display: flex; gap: 10px; background: rgba(0,0,0,0.5); padding: 5px 20px; border-radius: 30px; margin-top: 15px; }
        .chip { width: 50px; height: 50px; border-radius: 50%; border: 3px dashed #666; background: #222; color: #aaa; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; }
        .chip.active { border-color: gold; color: gold; background: rgba(255,215,0,0.1); transform: scale(1.1); box-shadow: 0 0 10px gold; }

        /* TOAST */
        #toastBox { position: fixed; top: 50px; left: 50%; transform: translateX(-50%); z-index: 20000; pointer-events: none; }
        .toast { background: rgba(0,0,0,0.9); border: 2px solid gold; padding: 15px; border-radius: 8px; color: gold; font-weight: bold; margin-bottom: 5px; animation: slideDown 0.3s forwards; }
        @keyframes slideDown { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* MOBILE */
        @media (max-width: 768px) {
            .roulette-wrapper { flex-direction: column; }
            .wheel-container { width: 250px; height: 250px; }
            .r-table { grid-template-columns: 30px repeat(12, 28px) 20px; grid-template-rows: repeat(3, 30px) 30px 30px; gap: 1px; }
            .rc { font-size: 10px; }
        }
    </style>
</head>
<body>

    <div id="toastBox"></div>

    <div id="v-auth" class="view active">
        <h1 style="color:gold; font-size: 60px;">GRAND CASINO</h1>
        <div class="glass-panel">
            <h3 id="auth-title">MEMBER LOGIN</h3>
            <input id="u-in" placeholder="Username"><br>
            <input id="p-in" type="password" placeholder="Password"><br><br>
            <button id="btn-auth-action" class="btn-main" onclick="submitAuth()">ENTER CASINO</button><br>
            <button id="btn-auth-toggle" style="background:transparent; border:none; color:#aaa; margin-top:15px; text-decoration: underline; cursor:pointer;" onclick="toggleAuthMode()">Register New Account</button>
        </div>
    </div>

    <div id="v-home" class="view">
        <div class="glass-panel" style="width: 80%; max-width: 800px;">
            <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
                <h2>WELCOME, <span id="home-user" style="color:gold;">PLAYER</span></h2>
                <h2>BAL: <span id="home-bal" style="color:gold;">0</span></h2>
            </div>
            <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 20px;">
                <button class="btn-main" onclick="nav('v-roulette')" style="background: linear-gradient(45deg, #00E5FF, #0097A7); color:white;">ROULETTE</button>
                <button class="btn-main" onclick="alert('Use Roulette for now!')" style="background: #333; color:#666;">OTHER GAMES</button>
            </div>
        </div>
    </div>

    <div id="v-roulette" class="view" style="background: radial-gradient(circle, #222, #000);">
        <button onclick="nav('v-home')" style="position:absolute; top:20px; left:20px; padding:10px; background:#333; color:white; border:1px solid #555; cursor:pointer;">LOBBY</button>
        
        <div class="roulette-wrapper">
            <div class="wheel-section">
                <div class="wheel-container">
                    <img src="wheel.png" class="wheel-img" id="wheelImg">
                    <div class="wheel-marker">▼</div>
                </div>
                <h1 id="res-roul" style="font-size:40px; color:gold; margin:20px;">BETS OPEN</h1>
                <div id="timer" style="font-size:30px; color:cyan;">20</div>
            </div>

            <div class="table-section">
                <div style="margin-bottom:10px; color:gold; font-size:20px;">BALANCE: <span id="bal-roul">0</span></div>
                
                <div class="r-table" id="rGrid">
                    <div style="grid-row:1/span 3; grid-column:1; display:flex; flex-direction:column;">
                        <div class="rc rc-green" style="flex:1; border-bottom:1px solid rgba(255,255,255,0.2);" onclick="betR('0')">0</div>
                        <div class="rc rc-green" style="flex:1;" onclick="betR('00')">00</div>
                    </div>

                    <div class="rc rc-felt" style="grid-row:1; grid-column:14;" onclick="betR('2TO1_3')">2:1</div>
                    <div class="rc rc-felt" style="grid-row:2; grid-column:14;" onclick="betR('2TO1_2')">2:1</div>
                    <div class="rc rc-felt" style="grid-row:3; grid-column:14;" onclick="betR('2TO1_1')">2:1</div>

                    <div class="rc rc-felt" style="grid-row:4; grid-column:2/span 4;" onclick="betR('1ST12')">1st 12</div>
                    <div class="rc rc-felt" style="grid-row:4; grid-column:6/span 4;" onclick="betR('2ND12')">2nd 12</div>
                    <div class="rc rc-felt" style="grid-row:4; grid-column:10/span 4;" onclick="betR('3RD12')">3rd 12</div>

                    <div class="rc rc-felt" style="grid-row:5; grid-column:2/span 2;" onclick="betR('1-18')">1-18</div>
                    <div class="rc rc-felt" style="grid-row:5; grid-column:4/span 2;" onclick="betR('EVEN')">EVEN</div>
                    <div class="rc rc-red" style="grid-row:5; grid-column:6/span 2;" onclick="betR('RED')"></div>
                    <div class="rc rc-black" style="grid-row:5; grid-column:8/span 2;" onclick="betR('BLACK')"></div>
                    <div class="rc rc-felt" style="grid-row:5; grid-column:10/span 2;" onclick="betR('ODD')">ODD</div>
                    <div class="rc rc-felt" style="grid-row:5; grid-column:12/span 2;" onclick="betR('19-36')">19-36</div>
                </div>

                <div class="chip-rack">
                    <div class="chip active" onclick="setChip(50, this)">50</div>
                    <div class="chip" onclick="setChip(100, this)">100</div>
                    <div class="chip" onclick="setChip(500, this)">500</div>
                    <div class="chip" onclick="setChip(1000, this)">1K</div>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const s = io();
        let curChip = 50;
        let isRegister = false;

        // --- NAVIGATION ---
        function nav(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // --- AUTH ---
        function toggleAuthMode() {
            isRegister = !isRegister;
            document.getElementById('auth-title').innerText = isRegister ? "CREATE ACCOUNT" : "MEMBER LOGIN";
            document.getElementById('btn-auth-action').innerText = isRegister ? "REGISTER" : "ENTER CASINO";
            document.getElementById('btn-auth-toggle').innerText = isRegister ? "Back to Login" : "Register New Account";
        }
        function submitAuth() {
            const u = document.getElementById('u-in').value;
            const p = document.getElementById('p-in').value;
            if(!u || !p) return alert("Fill all fields");
            // Sends both formats to be safe
            s.emit(isRegister ? 'register' : 'login', {username:u, password:p, u:u, p:p});
        }
        s.on('login_success', d => {
            nav('v-home');
            updateBal(d.balance);
            document.getElementById('home-user').innerText = d.username;
        });
        s.on('login_error', m => alert(m));

        function updateBal(b) {
            document.getElementById('home-bal').innerText = b;
            document.getElementById('bal-roul').innerText = b;
        }
        s.on('update_balance', updateBal);
        
        function toast(msg) {
            const b = document.getElementById('toastBox');
            const d = document.createElement('div'); d.className='toast'; d.innerText=msg;
            b.appendChild(d); setTimeout(()=>d.remove(), 3000);
        }
        s.on('notification', d => toast(d.msg));

        // --- ROULETTE GENERATION ---
        // Generating numbers 1-36 in 3 rows
        // Top Row: 3, 6, 9... | Mid: 2, 5, 8... | Bot: 1, 4, 7...
        // Columns 2 to 13
        const rGrid = document.getElementById('rGrid');
        const R_REDS = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
        
        // Loop columns 1 to 12 (represents betting columns)
        for(let col=1; col<=12; col++) {
            // Row 3 (Top visually): 3 * col
            createCell(3 * col, 1, col + 1);
            // Row 2 (Mid visually): 3 * col - 1
            createCell(3 * col - 1, 2, col + 1);
            // Row 1 (Bot visually): 3 * col - 2
            createCell(3 * col - 2, 3, col + 1);
        }

        function createCell(num, row, colIdx) {
            let div = document.createElement('div');
            div.className = `rc ${R_REDS.includes(num)?'rc-red':'rc-black'}`;
            div.innerText = num;
            div.style.gridRow = row;
            div.style.gridColumn = colIdx;
            div.onclick = () => betR(num.toString());
            rGrid.appendChild(div);
        }

        function setChip(v, el) { 
            curChip = v; 
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
        }
        function betR(spot) { s.emit('bet_roulette', {bet:spot, amt:curChip}); toast(`Bet ${spot}`); }

        // --- GAME LOGIC ---
        s.on('timer_update', t => {
            document.getElementById('timer').innerText = t;
            document.getElementById('res-roul').innerText = "BETS OPEN";
            document.getElementById('res-roul').style.color = "gold";
        });
        s.on('game_rolling', () => {
            document.getElementById('timer').innerText = "--";
            document.getElementById('res-roul').innerText = "SPINNING...";
            document.getElementById('wheelImg').style.transform = `rotate(${360 * 5 + Math.random() * 360}deg)`;
        });
        s.on('result_roulette', d => {
            document.getElementById('res-roul').innerText = `${d.result.n} ${d.result.c}`;
            document.getElementById('res-roul').style.color = d.result.c==='RED'?'#ff4444':(d.result.c==='BLACK'?'white':'#00C853');
            document.getElementById('wheelImg').style.transition = 'none';
            document.getElementById('wheelImg').style.transform = 'rotate(0deg)';
            setTimeout(() => { document.getElementById('wheelImg').style.transition = 'transform 4s cubic-bezier(0.1, 0.8, 0.1, 1)'; }, 50);
        });

    </script>
</body>
</html>
