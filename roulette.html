<!DOCTYPE html>
<html>
<head>
    <title>Roulette</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;800&display=swap" rel="stylesheet">
    <style>
        body { background: #111; color: white; font-family: 'Rajdhani'; margin: 0; text-align: center; overflow: hidden; }
        .nav { background: #222; padding: 10px; display: flex; justify-content: center; gap: 10px; border-bottom: 1px solid #444; }
        .nav a { color: #888; text-decoration: none; font-weight: bold; padding: 5px 15px; border-radius: 4px; }
        .nav a.active, .nav a:hover { background: #FFD700; color: black; }
        .board { display: grid; grid-template-columns: 50px repeat(3, 1fr); gap: 2px; max-width: 600px; margin: 20px auto; }
        .cell { height: 40px; display: flex; align-items: center; justify-content: center; background: #333; cursor: pointer; font-weight: bold; }
        .cell:hover { background: #555; }
        .red { background: #d32f2f; } .black { background: #222; } .green { background: #388e3c; }
        .chip-sel { display: flex; justify-content: center; gap: 10px; margin: 10px; }
        .chip { padding: 10px; background: #222; border: 2px solid #555; border-radius: 50%; cursor: pointer; }
        .chip.active { border-color: gold; color: gold; }
    </style>
</head>
<body>
    <div id="auth" style="position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:9; display:flex; justify-content:center; align-items:center; flex-direction:column; gap:10px;">
        <h1 style="color:gold">LOGIN</h1>
        <input id="u" placeholder="User"><input id="p" type="password" placeholder="Pass">
        <button onclick="login()">Enter</button>
    </div>

    <div class="nav">
        <a href="/">COLORS</a>
        <a href="/roulette" class="active">ROULETTE</a>
        <a href="/blackjack">BLACKJACK</a>
        <a href="/baccarat">BACCARAT</a>
    </div>

    <h3>ROULETTE | Bal: <span id="bal" style="color:gold">0</span> | Time: <span id="timer" style="color:cyan">20</span></h3>
    <h1 id="result">WAITING</h1>

    <div class="chip-sel">
        <div class="chip active" onclick="c=50;document.querySelectorAll('.chip').forEach(e=>e.classList.remove('active'));this.classList.add('active')">50</div>
        <div class="chip" onclick="c=100;document.querySelectorAll('.chip').forEach(e=>e.classList.remove('active'));this.classList.add('active')">100</div>
    </div>

    <div class="board" id="board">
        <div class="cell green" style="grid-row: span 2;" onclick="b('0')">0</div>
        <div id="nums" style="display:contents"></div>
        <div class="cell green" style="grid-column: 1;" onclick="b('00')">00</div>
        <div style="grid-column: 2/span 4; display:flex; gap:2px; margin-top:5px;">
            <div class="cell" style="flex:1" onclick="b('RED')">RED</div>
            <div class="cell" style="flex:1" onclick="b('BLACK')">BLACK</div>
            <div class="cell" style="flex:1" onclick="b('EVEN')">EVEN</div>
            <div class="cell" style="flex:1" onclick="b('ODD')">ODD</div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const s = io();
        let c = 50;
        function login(){s.emit('login',{u:document.getElementById('u').value,p:document.getElementById('p').value});}
        s.on('login_ok',d=>{document.getElementById('auth').style.display='none';document.getElementById('bal').innerText=d.b;});
        s.on('update_balance',b=>document.getElementById('bal').innerText=b);
        s.on('timer_update',t=>document.getElementById('timer').innerText=t);
        s.on('result_roulette',r=>document.getElementById('result').innerText=`${r.n} ${r.c}`);
        function b(spot){ s.emit('bet_roulette',{bet:spot,amt:c}); }
        const REDS=[1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
        const g = document.getElementById('nums');
        for(let i=0; i<12; i++) {
            g.innerHTML += `<div style="display:none"></div>`;
            for(let j=1; j<=3; j++) {
                let n = i*3+j;
                let col = REDS.includes(n)?'red':'black';
                g.innerHTML += `<div class="cell ${col}" onclick="b('${n}')">${n}</div>`;
            }
        }
    </script>
</body>
</html>
